name: CI/CD - React.js Application with Docker

on:
push:
branches: [main]
pull_request:
branches: [main]
types: [opened, synchronize, reopened]

jobs:
build-test-push:
name: Build, Test and Push Docker Image
runs-on: ubuntu-latest

```
steps:
  # 1. Checkout do código
  - name: Checkout source code
    uses: actions/checkout@v4

  # 2. Setup do Buildx
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  # 3. Cache de camadas Docker
  - name: Cache Docker layers
    uses: actions/cache@v4
    with:
      path: /tmp/.buildx-cache
      key: ${{ runner.os }}-buildx-${{ github.sha }}
      restore-keys: |
        ${{ runner.os }}-buildx-

  # 4. Metadata
  - name: Extract metadata
    id: meta
    run: |
      echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
      echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # 5. Build da imagem (única)
  - name: Build Docker image
    uses: docker/build-push-action@v5
    with:
      context: .
      file: Dockerfile
      tags: ${{ steps.meta.outputs.REPO_NAME }}:latest
      load: true
      cache-from: type=local,src=/tmp/.buildx-cache
      cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

  # 6. Atualiza cache
  - name: Update Docker cache
    run: |
      rm -rf /tmp/.buildx-cache
      mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # 7. Rodar testes
  - name: Run Vitest tests
    run: |
      docker run --rm \
        --entrypoint "" \
        ${{ steps.meta.outputs.REPO_NAME }}:latest \
        sh -c "npm install && npx vitest run --reporter=verbose"
    env:
      CI: true
      NODE_ENV: test
    timeout-minutes: 10

  # 8. Login no Docker Hub
  - name: Log in to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  # 9. Build e push da imagem final
  - name: Build and push production image
    uses: docker/build-push-action@v5
    with:
      context: .
      file: Dockerfile
      push: true
      platforms: linux/amd64,linux/arm64
      tags: |
        ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest
        ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}
      cache-from: type=local,src=/tmp/.buildx-cache
```
